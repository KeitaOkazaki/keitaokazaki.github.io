<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey 相互連携テスト</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; padding: 2rem; background: #f0f2f5; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #1c1e21; text-align: center; }
        p { color: #666; font-size: 0.9rem; text-align: center; }
        button { width: 100%; padding: 0.8rem; background: #007bff; color: white; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; margin-top: 1rem; }
        button:hover { background: #0056b3; }
        #log { margin-top: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 0.5rem; font-size: 0.85rem; color: #65676b; white-space: pre-wrap; border: 1px solid #ddd; min-height: 50px; }
        .success { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>Passkey 連携テスト</h1>
    <p>テストドメイン: <b>keitaokazaki.github.io</b></p>
    
    <button onclick="createPasskey()">➕ Passkeyを登録</button>
    <button onclick="loginWithPasskey()">🔑 スマホの鍵でログイン</button>
    
    <div id="log">ステータス: 待機中...</div>
</div>

<script>

    function bufferToBase64(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer)));
    }


    function bufferToString(buffer) {
        return new TextDecoder().decode(buffer);
    }

    const logDiv = document.getElementById('log');
    function log(msg, isSuccess = false) {
        if(isSuccess) {
            logDiv.innerHTML = `<span class="success">${msg}</span>`;
        } else {
            logDiv.innerText = msg;
        }
    }

    // Base64をUint8Arrayに変換 (AndroidのKotlinコードと一致させるため)
    function bufferFromBase64(base64) {
        const bin = window.atob(base64.replace(/-/g, '+').replace(/_/g, '/'));
        return Uint8Array.from(bin, c => c.charCodeAt(0));
    }

    async function createPasskey() {
        try {
            log("Passkey登録を開始しています...");

            // MainActivity.kt の createPasskey() と完全に一致するパラメータ
            const publicKeyCredentialCreationOptions = {
                // Kotlinの createPasskey() 内の challenge と一致
                challenge: bufferFromBase64("dGVzdC1jaGFsbGVuZ2UtMTIzNDU2Nz"),
                rp: {
                    id: "keitaokazaki.github.io",
                    name: "FIDO2 Test App"
                },
                user: {
                    // Kotlinの user.id と一致（base64）
                    id: bufferFromBase64("dXNlci1pZC0xMjM0NTY4"),
                    name: "user@testuser_test",
                    displayName: "Test User"
                },
                pubKeyCredParams: [
                    {
                        type: "public-key",
                        alg: -7  // ES256
                    },
                ],
                timeout: 60000,
                authenticatorSelection: {
                    residentKey: "required",
                    requireResidentKey: true,
                    userVerification: "required"
                },
                attestation: "direct"
            };

            const credential = await navigator.credentials.create({
                publicKey: publicKeyCredentialCreationOptions
            });

            const response = credential.response;
            const clientDataJSON = bufferToString(response.clientDataJSON); 
            const attestationObject = bufferToBase64(response.attestationObject); 

            console.log("=== 詳細 ===");
            console.log("Credential ID:", credential.id);
            console.log("clientDataJSON :", clientDataJSON);
            console.log("attestationObject (Base64):", attestationObject);

            log(`✅ 成功！\nOrigin: ${JSON.parse(clientDataJSON).origin}\nID: ${credential.id}`, true);

            console.log("NATIVE_SIGNAL:REGISTRATION_SUCCESS", credential);
            log("✅ Passkey登録成功！\nウェブ側で登録したパスキーをアプリで使用できます。", true);
            
            // Native通信、登録成功を通知
            if (window.AndroidBridge) {
                window.AndroidBridge.onRegistrationSuccess(JSON.stringify({
                    id: credential.id,
                    type: credential.type
                }));
            }
        } catch (err) {
            console.error("NATIVE_SIGNAL:REGISTRATION_ERROR", err.message);
            log("❌ 登録エラー: " + err.message + "\n\nヒント: ブラウザがPasskeyをサポートしているか、生体認証が設定されているか確認してください。");
            
            // Native通信、登録失敗を通知
            if (window.AndroidBridge) {
                window.AndroidBridge.onRegistrationError(err.message);
            }
        }
    }

    async function loginWithPasskey() {
        try {
            log("生体認証を呼び出しています...");

            // あなたの MainActivity.kt に記載されているパラメータと完全に一致させています
            const publicKeyCredentialRequestOptions = {
                // Kotlinの authenticatePasskey() 内の challenge と一致
                challenge: bufferFromBase64("dGVzdC1jaGFsbGVuZ2UtbG9naW4tMTIzNDU2Nzg5MA"),
                rpId: "keitaokazaki.github.io",
                userVerification: "required",
                timeout: 60000
            };

            const assertion = await navigator.credentials.get({
                publicKey: publicKeyCredentialRequestOptions
            });

            console.log("NATIVE_SIGNAL:LOGIN_SUCCESS", assertion);
            log("✅ 認証成功！\nウェブ側でアプリが作成したパスキーを認識しました。", true);
            
            // Navtive通信、ログイン成功を通知
            if (window.AndroidBridge) {
                window.AndroidBridge.onLoginSuccess(JSON.stringify({
                    id: assertion.id,
                    type: assertion.type
                }));
            }
        } catch (err) {
            console.error("NATIVE_SIGNAL:LOGIN_ERROR", err.message);
            log("❌ 認証エラー: " + err.message + "\n\nヒント: アプリで登録済みか、Googleアカウントが同期されているか確認してください。");
            
            // Navtive通信、ログイン失敗を通知
            if (window.AndroidBridge) {
                window.AndroidBridge.onLoginError(err.message);
            }
        }
    }
</script>

</body>
</html>
